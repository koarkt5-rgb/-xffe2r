name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIPFILE=$(find . -iname "*.zip" | head -n 1)
          unzip -o "$ZIPFILE" -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 2 -name "settings.gradle" -exec dirname {} \;)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OxideLauncher-apk
          path: extracted/**/app-debug.apk
