name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Build Everything Automatically
        run: |
          # 1. Распаковка архива
          mkdir -p build_dir
          if ls *.zip 1> /dev/null 2>&1; then unzip -o *.zip -d build_dir
          elif ls *.7z 1> /dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; 7z x *.7z -obuild_dir
          else cp -r . build_dir/; fi
          
          SETTINGS_FILE=$(find build_dir -name "settings.gradle" | head -n 1)
          PROJECT_DIR=$(realpath $(dirname "$SETTINGS_FILE"))
          cd "$PROJECT_DIR"
          
          # 2. Настройка Gradle
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
          }
          rootProject.name = "OxideLauncher"
          include ':app'
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.oxidelauncher'
              compileSdk 34
              ndkVersion "25.2.9519653"
              defaultConfig {
                  applicationId "com.example.oxidelauncher"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  ndk { abiFilters 'arm64-v8a' }
              }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'com.github.topjohnwu.libsu:core:5.2.2' }
          EOF
          
          # 3. Клонирование ImGui и Dobby
          cd app/src/main/cpp
          git clone --depth 1 https://github.com/ocornut/imgui.git
          git clone --depth 1 https://github.com/jmpews/Dobby.git
          
          # 4. ИСПРАВЛЕНИЕ ОШИБКИ DOBBY (@PAGE -> :pg_hi21:)
          echo "Патчим Dobby для совместимости с NDK..."
          find Dobby -type f \( -name "*.S" -o -name "*.asm" \) -exec sed -i 's/@PAGE/:pg_hi21:/g' {} +
          
          # 5. CMakeLists.txt
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("oxide")

          # Инжектор
          add_executable(injector_bin injector_bin.cpp)
          target_link_libraries(injector_bin log dl)
          set_target_properties(injector_bin PROPERTIES OUTPUT_NAME "injector_bin.so")

          # Dobby
          if(NOT TARGET dobby)
              set(DOBBY_DIR ${CMAKE_CURRENT_SOURCE_DIR}/Dobby)
              macro(SET_OPTION option value)
                  set(${option} ${value} CACHE INTERNAL "" FORCE)
              endmacro()
              SET_OPTION(DOBBY_DEBUG OFF)
              SET_OPTION(DOBBY_GENERATE_SHARED OFF)
              add_subdirectory(${DOBBY_DIR} dobby)
              get_property(DOBBY_INCLUDE_DIRECTORIES TARGET dobby PROPERTY INCLUDE_DIRECTORIES)
          endif()

          # Меню (ImGui + Vulkan)
          add_library(modmenu SHARED modmenu.cpp 
              imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_vulkan.cpp imgui/backends/imgui_impl_android.cpp
          )
          target_include_directories(modmenu PRIVATE imgui ${DOBBY_INCLUDE_DIRECTORIES})

          find_library(log-lib log)
          find_library(android-lib android)
          find_library(vulkan-lib vulkan)
          target_link_libraries(modmenu ${log-lib} ${android-lib} ${vulkan-lib} dl dobby)
          EOF
          
          # 6. injector_bin.cpp (с memfd fallback)
          cat << 'EOF' > injector_bin.cpp
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/ptrace.h>
          #include <sys/wait.h>
          #include <sys/mman.h>
          #include <sys/uio.h>
          #include <dlfcn.h>
          #include <linux/elf.h>
          #include <sys/user.h>
          #include <android/log.h>
          #include <fcntl.h>
          #include <sys/syscall.h>

          #define LOG_TAG "InjectorMemfd"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          uint64_t get_module_base(pid_t pid, const char* module_name) {
              char filename[64]; snprintf(filename, sizeof(filename), "/proc/%d/maps", pid);
              FILE* fp = fopen(filename, "r"); if (!fp) return 0;
              char line[512]; uint64_t base_addr = 0;
              while (fgets(line, sizeof(line), fp)) {
                  if (strstr(line, module_name) && strstr(line, "r-xp")) {
                      sscanf(line, "%lx-%*lx %*s %*lx %*s %*s", &base_addr); break;
                  }
              }
              fclose(fp); return base_addr;
          }

          int create_memfd(const char* path) {
              int fd = syscall(__NR_memfd_create, "mod.so", 0);
              if (fd < 0) { LOGI("memfd_create failed"); return -1; }
              FILE* f = fopen(path, "rb");
              if (!f) { LOGI("fopen failed"); close(fd); return -1; }
              fseek(f, 0, SEEK_END); long size = ftell(f); fseek(f, 0, SEEK_SET);
              void* buf = malloc(size); fread(buf, 1, size, f); fclose(f);
              if (write(fd, buf, size) != size) { free(buf); close(fd); return -1; }
              free(buf); return fd;
          }

          void* load_from_memfd(int fd) {
              void* handle = dlopen("libdl.so", RTLD_LAZY);
              if (!handle) return NULL;
              void* func = dlsym(handle, "android_dlopen_ext");
              if (!func) return NULL;
              struct android_dlextinfo { uint64_t flags; void* reserved_addr; size_t reserved_size; int relro_fd; int library_fd; off64_t library_fd_offset; void* library_namespace; };
              struct android_dlextinfo info = {0};
              info.flags = 0x10; // ANDROID_DLEXT_USE_LIBRARY_FD
              info.library_fd = fd;
              typedef void* (*android_dlopen_ext_t)(const char*, int, const struct android_dlextinfo*);
              android_dlopen_ext_t android_dlopen_ext = (android_dlopen_ext_t)func;
              return android_dlopen_ext("mod.so", RTLD_NOW, &info);
          }

          int main(int argc, char** argv) {
              if (argc < 3) return 7;
              pid_t pid = atoi(argv[1]);
              const char* path = argv[2];

              if (ptrace(PTRACE_ATTACH, pid, 0, 0) == -1) {
                  LOGI("ptrace failed, trying memfd fallback...");
                  int fd = create_memfd(path);
                  if (fd < 0) return 1;
                  void* h = load_from_memfd(fd);
                  close(fd);
                  return h ? 0 : 5;
              }
              int status; waitpid(pid, &status, 0);
              
              uint64_t target_libc_base = get_module_base(pid, "libc.so");
              if (!target_libc_base) { ptrace(PTRACE_DETACH, pid, 0, 0); return 2; }
              void* local_libc = dlopen("libc.so", RTLD_LAZY);
              uint64_t local_libc_base = get_module_base(getpid(), "libc.so");
              uint64_t target_mmap = target_libc_base + ((uint64_t)dlsym(local_libc, "mmap") - local_libc_base);
              uint64_t target_dlopen = target_libc_base + ((uint64_t)dlsym(local_libc, "dlopen") - local_libc_base);

              struct user_pt_regs regs;
              struct iovec io = { .iov_base = &regs, .iov_len = sizeof(regs) };
              if (ptrace(PTRACE_GETREGSET, pid, NT_PRSTATUS, &io) == -1) { ptrace(PTRACE_DETACH, pid, 0, 0); return 3; }
              struct user_pt_regs saved_regs = regs;

              uint64_t mmap_args[] = {0, 256, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS, (uint64_t)-1, 0};
              for(int i=0; i<6; i++) regs.regs[i] = mmap_args[i];
              regs.pc = target_mmap;
              ptrace(PTRACE_SETREGSET, pid, NT_PRSTATUS, &io);
              ptrace(PTRACE_CONT, pid, 0, 0);
              waitpid(pid, &status, 0);
              ptrace(PTRACE_GETREGSET, pid, NT_PRSTATUS, &io);
              uint64_t remote_mem = regs.regs[0];
              if (!remote_mem) { ptrace(PTRACE_DETACH, pid, 0, 0); return 4; }

              struct iovec local_iov = { .iov_base = (void*)path, .iov_len = strlen(path) + 1 };
              struct iovec remote_iov = { .iov_base = (void*)remote_mem, .iov_len = strlen(path) + 1 };
              process_vm_writev(pid, &local_iov, 1, &remote_iov, 1, 0);

              regs = saved_regs; regs.regs[0] = remote_mem; regs.regs[1] = RTLD_NOW; regs.pc = target_dlopen;
              ptrace(PTRACE_SETREGSET, pid, NT_PRSTATUS, &io);
              ptrace(PTRACE_CONT, pid, 0, 0); waitpid(pid, &status, 0);
              ptrace(PTRACE_GETREGSET, pid, NT_PRSTATUS, &io);
              uint64_t handle = regs.regs[0];
              ptrace(PTRACE_SETREGSET, pid, NT_PRSTATUS, &io);
              ptrace(PTRACE_DETACH, pid, 0, 0);
              return handle != 0 ? 0 : 5;
          }
          EOF

          # 7. modmenu.cpp (ImGui + Vulkan)
          cat << 'EOF' > modmenu.cpp
          #include <jni.h>
          #include <android/log.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <vulkan/vulkan.h>
          #include <dlfcn.h>
          #include "imgui/imgui.h"
          #include "imgui/backends/imgui_impl_vulkan.h"
          #include "imgui/backends/imgui_impl_android.h"
          #include "dobby.h"

          #define LOG_TAG "OxideCheat"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          bool isInit = false;
          VkResult (*orig_vkQueuePresentKHR)(VkQueue, const VkPresentInfoKHR*) = nullptr;

          VkResult hook_vkQueuePresentKHR(VkQueue queue, const VkPresentInfoKHR* pPresentInfo) {
              if (!isInit) {
                  isInit = true;
                  LOGI("vkQueuePresentKHR hooked!");
                  IMGUI_CHECKVERSION();
                  ImGui::CreateContext();
                  ImGui::StyleColorsDark();
                  ImGui_ImplAndroid_Init(nullptr);
              }
              return orig_vkQueuePresentKHR(queue, pPresentInfo);
          }

          void* menu_thread(void*) {
              sleep(5); 
              void* handle = dlopen("libvulkan.so", RTLD_LAZY);
              if (!handle) { LOGI("libvulkan.so not found"); return nullptr; }
              void* target = dlsym(handle, "vkQueuePresentKHR");
              if (!target) { LOGI("vkQueuePresentKHR not found"); return nullptr; }
              LOGI("Hooking vkQueuePresentKHR...");
              DobbyHook(target, (void*)hook_vkQueuePresentKHR, (void**)&orig_vkQueuePresentKHR);
              LOGI("Hook installed!");
              return nullptr;
          }

          __attribute__((constructor)) void init() {
              LOGI("Library loaded!");
              pthread_t t; pthread_create(&t, nullptr, menu_thread, nullptr);
          }
          EOF

          # 8. MainActivity.java
          cd "$PROJECT_DIR"
          mkdir -p app/src/main/java/com/example/oxidelauncher
          cat << 'EOF' > app/src/main/java/com/example/oxidelauncher/MainActivity.java
          package com.example.oxidelauncher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;
          import java.util.List;
          import com.topjohnwu.superuser.Shell;

          public class MainActivity extends Activity {
              static { System.loadLibrary("injector_bin"); }
              public native int runInjection(String pid, String path);

              private final String TARGET_PACKAGE = "com.catsbit.oxidesurvivalisland";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  TextView btnLaunch = findViewById(R.id.btnLaunch);
                  findViewById(R.id.btnAddPlugin).setVisibility(TextView.GONE);

                  btnLaunch.setOnClickListener(v -> new Thread(() -> doInject(TARGET_PACKAGE)).start());
              }

              private void doInject(String pkg) {
                  runOnUiThread(() -> Toast.makeText(this, "Запуск...", Toast.LENGTH_SHORT).show());
                  Shell.cmd("monkey -p " + pkg + " 1").exec();

                  int pid = -1;
                  long startTime = System.currentTimeMillis();
                  while (System.currentTimeMillis() - startTime < 15000) {
                      List<String> out = Shell.cmd("pidof " + pkg).exec().getOut();
                      if (!out.isEmpty()) {
                          pid = Integer.parseInt(out.get(0).trim().split(" ")[0]);
                          break;
                      }
                      try { Thread.sleep(300); } catch (Exception ignored) {}
                  }

                  if (pid == -1) {
                      runOnUiThread(() -> Toast.makeText(this, "Игра не запустилась", Toast.LENGTH_LONG).show());
                      return;
                  }

                  File modFile = new File(getApplicationInfo().nativeLibraryDir, "libmodmenu.so");
                  String targetPath = "/data/local/tmp/mod.so";
                  Shell.cmd("su -c 'cp " + modFile.getAbsolutePath() + " " + targetPath + "'").exec();
                  Shell.cmd("su -c 'chmod 755 " + targetPath + "'").exec();

                  int code = runInjection(String.valueOf(pid), targetPath);
                  runOnUiThread(() -> Toast.makeText(this, "Код: " + code, Toast.LENGTH_LONG).show());
              }
          }
          EOF

          # 9. Сборка
          cd "$PROJECT_DIR"
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
