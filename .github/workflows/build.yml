name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build Everything Automatically
        run: |
          # 1. Распаковка архива
          mkdir -p build_dir
          if ls *.zip 1> /dev/null 2>&1; then unzip -o *.zip -d build_dir
          elif ls *.7z 1> /dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; 7z x *.7z -obuild_dir
          else cp -r . build_dir/; fi
          
          SETTINGS_FILE=$(find build_dir -name "settings.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"
          
          # 2. Перезаписываем settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
          }
          rootProject.name = "OxideLauncher"
          include ':app'
          EOF
          
          # 3. Перезаписываем app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.oxidelauncher'
              compileSdk 34
              ndkVersion "27.0.12077973"
              defaultConfig {
                  applicationId "com.example.oxidelauncher"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'com.github.topjohnwu.libsu:core:5.2.2' }
          EOF
          
          # 4. Создаем C++ файлы
          mkdir -p app/src/main/cpp
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("injector")
          add_library(injector SHARED native-lib.cpp)
          find_library(log-lib log)
          target_link_libraries(injector ${log-lib} dl)
          EOF
          
          cat << 'EOF' > app/src/main/cpp/native-lib.cpp
          #include <jni.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/ptrace.h>
          #include <sys/wait.h>
          #include <sys/mman.h>
          #include <sys/uio.h>
          #include <dlfcn.h>
          #include <linux/elf.h>
          #include <sys/user.h>
          
          uint64_t get_module_base(pid_t pid, const char* module_name) {
              char filename[64]; snprintf(filename, sizeof(filename), "/proc/%d/maps", pid);
              FILE* fp = fopen(filename, "r"); if (!fp) return 0;
              char line[512]; uint64_t base_addr = 0;
              while (fgets(line, sizeof(line), fp)) {
                  if (strstr(line, module_name) && strstr(line, "r-xp")) {
                      sscanf(line, "%lx-%*lx %*s %*lx %*s %*s", &base_addr); break;
                  }
              }
              fclose(fp); return base_addr;
          }
          
          uint64_t remote_call(pid_t pid, uint64_t func_addr, uint64_t* args, int arg_count) {
              struct user_pt_regs regs;
              struct iovec io = { .iov_base = &regs, .iov_len = sizeof(regs) };
              if (ptrace(PTRACE_GETREGSET, pid, NT_PRSTATUS, &io) == -1) return 0;
              struct user_pt_regs saved_regs = regs;
              for (int i = 0; i < arg_count && i < 8; i++) regs.regs[i] = args[i];
              regs.pc = func_addr;
              if (ptrace(PTRACE_SETREGSET, pid, NT_PRSTATUS, &io) == -1) return 0;
              ptrace(PTRACE_CONT, pid, 0, 0);
              int status; waitpid(pid, &status, 0);
              ptrace(PTRACE_GETREGSET, pid, NT_PRSTATUS, &io);
              uint64_t ret_val = regs.regs[0];
              struct iovec io_saved = { .iov_base = &saved_regs, .iov_len = sizeof(saved_regs) };
              ptrace(PTRACE_SETREGSET, pid, NT_PRSTATUS, &io_saved);
              return ret_val;
          }
          
          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_example_oxidelauncher_MainActivity_injectLibrary(JNIEnv *env, jobject, jint pid, jstring lib_path) {
              const char* path = env->GetStringUTFChars(lib_path, 0);
              if (ptrace(PTRACE_ATTACH, pid, 0, 0) == -1) { env->ReleaseStringUTFChars(lib_path, path); return JNI_FALSE; }
              int status; waitpid(pid, &status, 0);
              uint64_t target_libc_base = get_module_base(pid, "libc.so");
              if (!target_libc_base) { ptrace(PTRACE_DETACH, pid, 0, 0); env->ReleaseStringUTFChars(lib_path, path); return JNI_FALSE; }
              void* local_libc = dlopen("libc.so", RTLD_LAZY);
              uint64_t target_mmap = target_libc_base + ((uint64_t)dlsym(local_libc, "mmap") - get_module_base(getpid(), "libc.so"));
              uint64_t target_dlopen = target_libc_base + ((uint64_t)dlsym(local_libc, "dlopen") - get_module_base(getpid(), "libc.so"));
              uint64_t mmap_args[] = {0, 256, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS, (uint64_t)-1, 0};
              uint64_t remote_mem = remote_call(pid, target_mmap, mmap_args, 6);
              struct iovec local_iov = { .iov_base = (void*)path, .iov_len = strlen(path) + 1 };
              struct iovec remote_iov = { .iov_base = (void*)remote_mem, .iov_len = strlen(path) + 1 };
              process_vm_writev(pid, &local_iov, 1, &remote_iov, 1, 0);
              uint64_t dlopen_args[] = {remote_mem, RTLD_NOW};
              uint64_t handle = remote_call(pid, target_dlopen, dlopen_args, 2);
              ptrace(PTRACE_DETACH, pid, 0, 0);
              env->ReleaseStringUTFChars(lib_path, path);
              return handle != 0 ? JNI_TRUE : JNI_FALSE;
          }
          EOF

          # 5. Создаем Java файл, который сам ищет Oxide и делает инжект
          mkdir -p app/src/main/java/com/example/oxidelauncher
          cat << 'EOF' > app/src/main/java/com/example/oxidelauncher/MainActivity.java
          package com.example.oxidelauncher;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.List;
          import com.topjohnwu.superuser.Shell;

          public class MainActivity extends Activity {
              static { System.loadLibrary("injector"); }
              public native boolean injectLibrary(int pid, String libPath);

              private String pluginPath = null;
              private final String TARGET_PACKAGE = "com.catsbit.oxidesurvivalisland";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  TextView btnAddPlugin = findViewById(R.id.btnAddPlugin);
                  TextView btnLaunch = findViewById(R.id.btnLaunch);

                  Shell.getShell(shell -> {
                      if (!shell.isRoot()) runOnUiThread(() -> Toast.makeText(this, "НЕТ ROOT!", Toast.LENGTH_LONG).show());
                  });

                  btnAddPlugin.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.setType("*/*");
                      startActivityForResult(i, 100);
                  });

                  btnLaunch.setOnClickListener(v -> {
                      if (pluginPath == null) {
                          Toast.makeText(this, "Выбери .so файл!", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      new Thread(() -> doInject(TARGET_PACKAGE, pluginPath)).start();
                  });
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 100 && res == RESULT_OK && data != null) {
                      try {
                          InputStream in = getContentResolver().openInputStream(data.getData());
                          File out = new File(getCacheDir(), "plugin.so");
                          FileOutputStream fos = new FileOutputStream(out);
                          byte[] buf = new byte[8192]; int n;
                          while ((n = in.read(buf)) > 0) fos.write(buf, 0, n);
                          fos.close(); in.close();
                          pluginPath = out.getAbsolutePath();
                          Toast.makeText(this, "Плагин загружен!", Toast.LENGTH_SHORT).show();
                      } catch (Exception e) {
                          Toast.makeText(this, "Ошибка: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      }
                  }
              }

              private void doInject(String pkg, String localSo) {
                  runOnUiThread(() -> Toast.makeText(this, "Запускаем Oxide...", Toast.LENGTH_SHORT).show());
                  Shell.cmd("monkey -p " + pkg + " 1").exec();

                  int pid = -1;
                  long startTime = System.currentTimeMillis();
                  while (System.currentTimeMillis() - startTime < 15000) {
                      List<String> out = Shell.cmd("pidof " + pkg).exec().getOut();
                      if (!out.isEmpty()) {
                          pid = Integer.parseInt(out.get(0).trim().split(" ")[0]);
                          break;
                      }
                      try { Thread.sleep(300); } catch (Exception ignored) {}
                  }

                  if (pid == -1) {
                      runOnUiThread(() -> Toast.makeText(this, "Игра не запустилась", Toast.LENGTH_LONG).show());
                      return;
                  }

                  Shell.cmd("cp " + localSo + " /data/local/tmp/mod.so").exec();
                  Shell.cmd("chmod 755 /data/local/tmp/mod.so").exec();

                  boolean ok = injectLibrary(pid, "/data/local/tmp/mod.so");
                  runOnUiThread(() -> Toast.makeText(this, ok ? "Инжект OK!" : "Инжект провален", Toast.LENGTH_LONG).show());
              }
          }
          EOF

          # 6. Запуск сборки
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
