name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip if needed
        run: |
          # Проверяем, есть ли zip-архив. Если есть - распаковываем.
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Найден архив, распаковываем..."
            unzip -o *.zip -d project
            cd project
            # Если внутри архива есть еще одна папка, заходим в нее
            if [ -d "OxideLauncher" ]; then cd OxideLauncher; fi
          else
            echo "Архив не найден, используем файлы из корня репозитория"
            mkdir project
            cp -r * project/ || true
            cd project
          fi

      - name: Build APK
        run: |
          cd project
          # Если файла gradlew нет, генерируем его через установленный Gradle
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
