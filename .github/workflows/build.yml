name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Prepare Source Code (Unzip)
        run: |
          mkdir -p build_dir
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip -d build_dir
          elif ls *.7z 1> /dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y p7zip-full
            7z x *.7z -obuild_dir
          else
            cp -r . build_dir/
          fi

      - name: Find Gradle Project and Build APK
        run: |
          SETTINGS_FILE=$(find build_dir -name "settings.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Найдена папка с проектом: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          # АВТОИСПРАВЛЕНИЕ: Перезаписываем settings.gradle, чтобы Gradle знал, где искать плагины
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "OxideLauncher"
          include ':app'
          EOF
          
          if [ ! -f "gradlew" ]; then
            echo "Генерируем gradlew..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
