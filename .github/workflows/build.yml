name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Prepare Source Code (Unzip)
        run: |
          mkdir -p build_dir
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Распаковываем ZIP..."
            unzip -o *.zip -d build_dir
          elif ls *.7z 1> /dev/null 2>&1; then
            echo "Распаковываем 7Z..."
            sudo apt-get update && sudo apt-get install -y p7zip-full
            7z x *.7z -obuild_dir
          else
            echo "Архивов нет, копируем файлы из корня..."
            cp -r . build_dir/
          fi

      - name: Find Gradle Project and Build APK
        run: |
          # Ищем файл settings.gradle по всем папкам
          SETTINGS_FILE=$(find build_dir -name "settings.gradle" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ОШИБКА: Файл settings.gradle не найден вообще!"
            exit 1
          fi
          
          # Получаем путь к папке, где лежит проект (например, build_dir/OxideLauncher)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Найдена папка с проектом: $PROJECT_DIR"
          
          # Переходим туда и собираем
          cd "$PROJECT_DIR"
          
          # Если нет gradlew, создаем его
          if [ ! -f "gradlew" ]; then
            echo "Генерируем gradlew..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          # Запускаем сборку
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-APK
          # Ищем готовый APK во всех вложенных папках
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
